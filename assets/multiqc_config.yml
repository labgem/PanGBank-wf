report_comment: >
  This report has been generated by the <a href="https://github.com/labgem/pangbank/tree/dev" target="_blank">labgem/pangbank</a>
  analysis pipeline.
report_section_order:
  "labgem-pangbank-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "labgem-pangbank-summary":
    order: -1002

export_plots: true
max_table_rows: 5000

disable_version_detection: true
show_analysis_paths: false

run_modules:
  - custom_content

custom_data:
  summary_pangenome:
    section_name: "Pangenome summary table"
    description: "This table provides an overview of key metrics describing the pangenome and its structural components."
    plot_type: "generalstats"
    pconfig:
      id: "summary_pangenome_table"
      title: "Summary pangenome table"
      namespace: "De novo assembly metrics"
    headers:
      Genomes:
        description: "Genomes included in the pangenome analysis."
        format: "{:,.0f}"
      Genes:
        description: "Genes across all genomes in the pangenome."
        format: "{:,.0f}"
      Persistent:
        description: "Gene families classified as persistent, shared by most genomes."
        format: "{:,.0f}"
      Shell:
        description: "Gene families classified as shell, present in a subset of genomes."
        format: "{:,.0f}"
      Cloud:
        description: "Gene families classified as cloud, specific to a small number of genomes."
        format: "{:,.0f}"
      Spots:
        description: "Spots of insertions predicted in the pangenome."
        format: "{:,.0f}"
      RGPs:
        description: "Regions of Genomic Plasticity (RGPs) predicted in the pangenome."
        format: "{:,.0f}"
      Modules:
        description: "Modules predicted in the pangenome."
        format: "{:,.0f}"

  partitions:
    plot_type: "bargraph"
    file_format: "tsv"
    section_name: "Pangenome Partitions"
    categories:
      Persistent:
        name: "Persistent"
        color: "#e59c04"
      Shell:
        name: "Shell"
        color: "#00d860"
      Cloud:
        name: "Cloud"
        color: "#79deff"
    pconfig:
      id: "partition_bargraph"
      title: "Distribution of Pangenome Partitions"
      ylab: "Families"
  spots:
    plot_type: "bargraph"
    file_format: "tsv"
    section_name: "Spots"
    categories:
      Spots:
        color: "#7a9a4c"
    pconfig:
      id: "spot_count_bargraph"
      title: "Spots Of Insertions Predicted in The Pangenomes"
      ylab: "Spots"
  modules:
    plot_type: "bargraph"
    file_format: "tsv"
    section_name: "Functional modules"
    categories:
      Modules:
        color: "#ca5c55"
    pconfig:
      id: "module_count_bargraph"
      title: "Modules Predicted In The Pangenomes"
      ylab: "Modules"

  dereplication:
    description: "The bar plot shows the number of genomes in three categories after dereplication. Reference genomes are a subset of the selected genomes, provided as input to ensure their retention during dereplication"

    plot_type: "bargraph"
    file_format: "tsv"
    section_name: "Dereplication"
    categories:
      selected_genomes:
        name: "selected_genomes"
        color: "#1E88E5"
      reference_genomes:
        name: "reference_genomes"
        color: "#003C4D"
      discarded_genomes:
        name: "discarded_genomes"
        color: "#D81B60"
    pconfig:
      id: "genomes_dereplicated_bargraph"
      title: "Genome Distribution After Dereplication"
      ylab: "Genomes"

  genome_quality_filtering:
    description: "Genome counts before and after quality filtering based on CheckM/CheckM2 completeness thresholds. 'representative_filtered' genomes were removed because their GTDB cluster representative was below the representative completeness threshold. 'genome_quality_filtered' genomes were removed because their own completeness score was below the genome completeness threshold."
    plot_type: "bargraph"
    file_format: "tsv"
    section_name: "Genome Quality Filtering"
    categories:
      retained_genomes:
        name: "Retained"
        color: "#1E88E5"
      representative_filtered:
        name: "Filtered (representative quality)"
        color: "#FFC107"
      genome_quality_filtered:
        name: "Filtered (genome quality)"
        color: "#D81B60"
    pconfig:
      id: "genome_quality_filtering_bargraph"
      title: "Genome Distribution After Quality Filtering"
      ylab: "Genomes"

  gtdb_merge:
    description: "Per-metaspecies summary of GTDB split species merging. 'merged_splits' is the number of GTDB split species that were merged together into a single pangenome cluster. 'singleton_splits' is the number of splits that could not be merged with any other split (retained as individual clusters)."
    plot_type: "bargraph"
    file_format: "tsv"
    section_name: "GTDB Split Species Merging"
    categories:
      merged_splits:
        name: "Merged Splits"
        color: "#1E88E5"
      singleton_splits:
        name: "Singleton Splits"
        color: "#D81B60"
    pconfig:
      id: "gtdb_merge_bargraph"
      title: "GTDB Split Species Merged Per Metaspecies"
      ylab: "Splits"

sp:
  summary_pangenome:
    fn: "pangenome_summary.tsv"
    shared: true
  genomes:
    fn: "pangenome_summary.tsv"
    shared: true
  partitions:
    fn: "pangenome_summary.tsv"
    shared: true
  spots:
    fn: "pangenome_summary.tsv"
    shared: true
  modules:
    fn: "pangenome_summary.tsv"
    shared: true
  dereplication:
    fn: "dereplication_summary.tsv"
  genome_quality_filtering:
    fn: "genome_quality_filtering_summary.tsv"
  gtdb_merge:
    fn: "gtdb_merge_summary.tsv"
