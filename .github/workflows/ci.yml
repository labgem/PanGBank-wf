name: pangbank CI
# This workflow runs the pipeline with the minimal test dataset to check that it completes without any syntax errors
on:
  push:
    branches:
      - dev
  pull_request:
  release:
    types: [published]

env:
  NXF_ANSI_LOG: false

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Run pipeline with test data
    # Only run on push if this is the nf-core dev branch (merged PRs)
    if: "${{ github.event_name != 'push' }}" #|| (github.event_name == 'push' && github.repository == 'nf-core/template') }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        NXF_VER:
          - "23.04.0"
          - "latest-everything"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Disk space cleanup
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - name: Run pipeline with test data
        # TODO nf-core: You can customise CI pipeline run tests as required
        # For example: adding multiple test runs with different parameters
        # Remember that you can parallelise this by using strategy.matrix
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile test,docker --help

      - name: Run pipeline with fna input
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile test,docker \
                                          --genomes https://raw.githubusercontent.com/labgem/PanGBank-test-datasets/main/input_files/genome_to_fna_path.tsv \
                                          --taxonomy https://raw.githubusercontent.com/labgem/PanGBank-test-datasets/main/input_files/genome_to_taxonomy.tsv \
                                          --outdir results_fna/

      - name: Run pipeline with gbff input
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile test,docker \
                                          --genomes https://raw.githubusercontent.com/labgem/PanGBank-test-datasets/main/input_files/genome_to_gbff_path.tsv \
                                          --taxonomy https://raw.githubusercontent.com/labgem/PanGBank-test-datasets/main/input_files/genome_to_taxonomy.tsv \
                                          --outdir results_gbff/
